<!DOCTYPE html>
<html lang="gu">
<head>
    <!-- ગુજરાતી ફોન્ટ્સ અને અક્ષરો સાચા દેખાડવા માટે UTF-8 એનકોડિંગ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>નિર્મળા નવોદય સ્ટડી ઝોન - ઓનલાઈન ટેસ્ટ</title>
    
    <!-- Google Gujarati Font (Noto Sans Gujarati) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Noto Sans Gujarati', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            color: #1c1e21;
        }

        /* હેડર સ્ટાઈલ */
        .header {
            background-color: #3b36db;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        /* ટેસ્ટ કાર્ડ */
        .test-card {
            background-color: white;
            margin-top: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .test-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .timer {
            background-color: #ffebe9;
            color: #d93025;
            font-weight: bold;
            font-size: 18px;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #ffc2c0;
        }

        /* પ્રશ્નો અને વિકલ્પો */
        .question-box {
            margin-bottom: 25px;
        }

        .question-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: #f7f8fa;
            border: 1px solid #e4e6eb;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item:hover {
            background-color: #ebedf0;
        }

        .option-item input[type="radio"] {
            transform: scale(1.2);
        }

        .share-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- મુખ્ય હેડર -->
    <div class="header">
        <h1>🎓 નિર્મળા નવોદય સ્ટડી ઝોન</h1>
        <a href="#" class="admin-btn">શિક્ષક ડેશબોર્ડ (Admin)</a>
    </div>

    <!-- ટેસ્ટ કાર્ડ -->
    <div class="test-card">
        <div class="test-info">
            <div>
                <strong style="color: #3b36db; font-size: 18px;">ટેસ્ટ નં. 12</strong><br>
                <span style="color: #65676b; font-size: 14px;">વિષય: ગણિત</span>
            </div>
            <div class="timer" id="timer">59:50</div>
        </div>

        <!-- પ્રશ્ન ૧ -->
        <div class="question-box">
            <div class="question-title">પ્રશ્ન 1: આપેલ સંખ્યાઓમાંથી કઈ સંખ્યા 4 વડે સંપૂર્ણ વિભાજ્ય છે?</div>
            <div class="options-list">
                <label class="option-item"><input type="radio" name="q1"> A. 1234</label>
                <label class="option-item"><input type="radio" name="q1"> B. 5672</label>
                <label class="option-item"><input type="radio" name="q1"> C. 8910</label>
                <label class="option-item"><input type="radio" name="q1"> D. 3411</label>
            </div>
        </div>

        <!-- પ્રશ્ન ૨ -->
        <div class="question-box">
            <div class="question-title">પ્રશ્ન 2: 0.5 ને ટકા (%) માં ફેરવો.</div>
            <div class="options-list">
                <label class="option-item"><input type="radio" name="q2"> A. 5%</label>
                <label class="option-item"><input type="radio" name="q2"> B. 50%</label>
                <label class="option-item"><input type="radio" name="q2"> C. 500%</label>
                <label class="option-item"><input type="radio" name="q2"> D. 0.05%</label>
            </div>
        </div>

        <!-- શેર લિંક માટે બટન -->
        <button class="share-btn" onclick="shareTest()">📲 ટેસ્ટ લિંક શેર કરો</button>
    </div>

    <script>
        // ૧. ટાઈમર સ્ક્રિપ્ટ
        let timeInSeconds = 3590; // 59 મિનિટ 50 સેકન્ડ
        const timerElement = document.getElementById('timer');

        setInterval(() => {
            if (timeInSeconds > 0) {
                timeInSeconds--;
                let minutes = Math.floor(timeInSeconds / 60);
                let seconds = timeInSeconds % 60;
                timerElement.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }
        }, 1000);

        // ૨. ટૂંકી લિંક બનાવવાની અને શેર કરવાની રીત (URL લંબાઈ ઘટાડવા માટે)
        function shareTest() {
            // આખો ડેટા મોકલવાને બદલે માત્ર ટેસ્ટ આઈડી (Test ID) મોકલો
            const testId = "12"; 
            const baseUrl = window.location.origin + window.location.pathname;
            const shortUrl = `${baseUrl}?test=${testId}`;

            // વોટ્સએપ પર શેર કરવા માટે
            const shareText = `નિર્મળા નવોદય સ્ટડી ઝોન - ઓનલાઈન ટેસ્ટ\nટેસ્ટ આપવા માટે નીચે આપેલી લિંક પર ક્લિક કરો:\n${shortUrl}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
