<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            word-break: break-all;
            display: none;
        }
        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>લિંક શોર્ટનર (URL Shortener)</h2>
    <input type="url" id="longUrl" placeholder="અહીં તમારી લાંબી લિંક પેસ્ટ કરો..." required>
    <br>
    <button onclick="shortenUrl()">લિંક શોર્ટ કરો</button>

    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <p><strong>શોર્ટ લિંક:</strong></p>
        <a id="shortUrl" href="#" target="_blank"></a>
    </div>
</div>

<script>
async function shortenUrl() {
    const longUrlInput = document.getElementById('longUrl').value.trim();
    const resultBox = document.getElementById('resultBox');
    const shortUrlAnchor = document.getElementById('shortUrl');
    const errorMsg = document.getElementById('errorMsg');

    // Reset UI
    resultBox.style.display = 'none';
    errorMsg.style.display = 'none';

    // લિંક ચેક કરો
    if (!longUrlInput) {
        errorMsg.innerText = "કૃપા કરીને પહેલા લિંક દાખલ કરો!";
        errorMsg.style.display = 'block';
        return;
    }

    try {
        // CORS સમસ્યા ઉકેલવા માટે Corsproxy + TinyURL API નો ઉપયોગ
        const apiUrl = `https://corsproxy.io/?${encodeURIComponent('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(longUrlInput))}`;

        const response = await fetch(apiUrl);
        
        if (!response.ok) {
            throw new Error('નેટવર્ક રિસપોન્સ બરાબર નથી');
        }

        const shortUrl = await response.text();

        if (shortUrl && shortUrl.startsWith('http')) {
            shortUrlAnchor.href = shortUrl;
            shortUrlAnchor.innerText = shortUrl;
            resultBox.style.display = 'block';
        } else {
            throw new Error('લિંક શોર્ટ થઈ શકી નથી. ફરી પ્રયાસ કરો.');
        }

    } catch (error) {
        errorMsg.innerText = "ભૂલ: " + error.message;
        errorMsg.style.display = 'block';
    }
}
</script>

</body>
</html>
